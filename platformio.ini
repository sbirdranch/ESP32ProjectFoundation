; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-uart

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
	-I include
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
lib_deps =
	knolleary/PubSubClient@^2.8.0
	bblanchon/ArduinoJson@^7.4.2
	fastled/FastLED@^3.9.15

[env:esp32-s3-usb]
; Use this environment only when connected to the Native USB socket.
build_flags = ${env.build_flags} -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32-s3-uart]
build_flags = ${env.build_flags}

[env:esp32-s3-ota]
build_flags = ${env.build_flags}
upload_protocol = espota
upload_port = esp32-foundation-01.local
upload_flags = --auth=${sysenv.ESP32_OTA_PASSWORD}
